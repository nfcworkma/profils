.foot{padding:30px 0 calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;color:var(--muted);letter-spacing:.06em}
.foot a{color:var(--accent2);font-weight:600}
.brand-logo{display:block;height:20px;width:auto}.foot-logo{display:inline-block;height:13px;width:auto;vertical-align:-2px;margin-inline-start:5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}

.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 2px}.stars span{width:38px;height:38px;color:#f5b400;display:block}
