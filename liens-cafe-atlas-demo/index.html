*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);min-height:100%}

.logo>*{width:100%;height:100%;border-radius:50%;border:4px solid var(--bg);object-fit:cover;display:grid;place-items:center;background:var(--surf2);color:var(--accent);font-weight:700;font-size:38px}
h1{text-align:center;font-size:26px;line-height:1.2;font-weight:700}
.sub{text-align:center;color:var(--muted);font-size:14.5px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;font-size:15.5px;cursor:pointer;background:var(--accent);color:var(--accentfg);margin-top:12px}
.btn.alt{background:var(--surf);color:var(--fg);border:1px solid var(--line)}
.btn svg{width:20px;height:20px;flex:none}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--surf);border:1px solid var(--line);margin-top:8px}
.row svg{width:20px;height:20px;color:var(--accent);flex:none}.row div{flex:1;min-width:0}
.row b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row span{font-size:12.5px;color:var(--muted)}
.row .ar{width:16px;height:16px;color:var(--line)}
.foot{padding:30px 0 calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;color:var(--muted);letter-spacing:.06em}
.foot a{color:var(--accent2);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style></head><body>
